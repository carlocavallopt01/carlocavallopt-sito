<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Carlo Cavallo Coach</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0F0C">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F0C;--surface:#171914;--line:#262820;--text:#F2F2EC;--soft:#C9CBC2;--muted:#A3A69B;--accent:#C6F432}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:18px;padding-bottom:18px}
.top a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-family:'Archivo',sans-serif;font-weight:800;font-size:18px}
.top img{width:42px;height:42px}
.top span{color:var(--accent);font-size:14px;letter-spacing:.12em}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
main{padding:56px 0 96px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:'Archivo',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(36px,6vw,56px);line-height:1;margin:10px 0 8px}
h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;margin:40px 0 10px}
p,li{color:var(--soft);font-size:16px;line-height:1.7}
ul{padding-left:20px}
.data{color:var(--muted);font-size:14px}
.torna{display:inline-block;margin-top:40px;font-weight:700}
.nf{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:64px 24px}
.nf .num{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(90px,22vw,180px);line-height:.85;color:var(--accent)}
.nf p{margin:0;max-width:520px}
.azioni{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:999px;font-weight:800;font-size:16px;padding:16px 26px;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.pieno{background:var(--accent);color:#0E0F0C}
.linea{border:1.5px solid #4A4D42;color:var(--text)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/"><img src="/img/logo-cc.webp" alt="" width="128" height="128">CARLO CAVALLO <span>COACH</span></a></div></header>
<main class="wrap nf">
<span class="num">404</span>
<h1>Pagina non trovata</h1>
<p>Il link che hai aperto non esiste o è stato spostato. Nessun problema: torna al sito o prenota direttamente il tuo check gratuito.</p>
<div class="azioni"><a class="btn pieno" href="/#contatti">Prenota il check gratuito</a><a class="btn linea" href="/">Torna al sito</a></div>
</main>
</body>
</html>
